<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tactical Breach</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="game-hidden">
<canvas id="game"></canvas>
<div id="crosshair"></div>
<div id="damage-flash"></div>

<div id="hud">
  <div id="hud-left">
    <div id="health">HP: 100</div>
    <div id="weapon-name">MP-Sidearm</div>
    <div id="ammo">Ammo: 12/12</div>
  </div>
  <div id="score">Score: 0</div>
</div>

<div id="touch-controls">
  <div id="stick-move" class="stick"><div class="stick-knob"></div></div>
  <button id="switch-btn">SWITCH</button>
  <button id="ads-btn">ADS</button>
  <button id="fire-btn">FIRE</button>
  <div id="stick-look" class="stick"><div class="stick-knob"></div></div>
</div>

<div id="vr-button-container"></div>
<button id="cardboard-btn">CARDBOARD VR</button>

<div id="loadout-screen">
  <h1>TACTICAL BREACH</h1>
  <p>Choose your loadout</p>
  <div id="loadout-list"></div>
  <button id="ready-btn">READY</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
