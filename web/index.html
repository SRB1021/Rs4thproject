<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tactical Breach</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="ammo">Ammo: 30/30</div>
  <div id="score">Score: 0</div>
</div>

<div id="touch-controls">
  <div id="stick-move" class="stick"><div class="stick-knob"></div></div>
  <button id="fire-btn">FIRE</button>
  <div id="stick-look" class="stick"><div class="stick-knob"></div></div>
</div>

<script src="game.js"></script>
</body>
</html>
